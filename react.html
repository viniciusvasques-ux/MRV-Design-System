.ds-card__media { position: relative; overflow: hidden; border-radius: var(--radius-400); background: var(--surface-disabled); aspect-ratio: 16 / 9; }
.ds-card__media > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ds-card__flag { position: absolute; top: 0; right: var(--ds-gap-small-xl); display: inline-flex; align-items: center; justify-content: center; width: var(--size-control-m, 40px); height: var(--size-control-l, 48px); border-radius: 0 0 var(--radius-200) var(--radius-200); background: var(--brand-complementary-05); color: var(--ds-white); }
.ds-card__note { display: flex; align-items: center; justify-content: center; min-height: var(--ds-btn-h); padding: 0 var(--ds-gap-small-l); border-radius: var(--radius-200); background: var(--surface-base); color: var(--ds-pos-text); text-align: center; }
.ds-card__delta { display: inline-flex; align-items: center; align-self: flex-start; gap: var(--ds-gap-small-m); padding: var(--ds-gap-small-s) var(--ds-gap-small-m); border-radius: var(--radius-200); background: var(--surface-base); color: var(--text-secondary); }
.ds-card__delta > b { display: inline-flex; align-items: center; gap: var(--ds-gap-small-s); color: var(--ds-pos-text); font-weight: 400; }
.ds-card__delta--negative > b { color: var(--ds-neg-text); }
.ds-card__badge { display: inline-flex; align-items: center; align-self: flex-start; gap: var(--ds-gap-small-m); height: 28px; padding: 0 var(--ds-gap-small-xl); border-radius: var(--radius-900); background: var(--brand-complementary-05); color: var(--ds-white); }
.ds-card__badge--positive { background: var(--action-primary); color: var(--text-on-action); }
.ds-card__badge--alert { background: var(--feedback-alert-bg); color: var(--text-active); }
.ds-card__badge--alert::before { content: ""; width: var(--size-icon-m, 20px); height: var(--ds-gap-small-m); border-radius: var(--radius-900); background: linear-gradient(90deg, var(--brand-secondary-pure), var(--brand-feedback-alert)); }

.ds-card__pill { display: inline-flex; align-items: center; height: 28px; padding: 0 var(--ds-gap-small-l); border-radius: var(--radius-900); background: var(--surface-disabled); color: var(--text-active); }
.ds-card__meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ds-gap-small-xl); }
.ds-card__bar { --v: 50; position: relative; flex: none; width: 100%; height: var(--ds-gap-small-m); border-radius: var(--radius-900); background: var(--surface-disabled); overflow: hidden; }
.ds-card__bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 1%); border-radius: var(--radius-900); background: linear-gradient(90deg, var(--brand-secondary-pure), var(--brand-feedback-alert)); }
.ds-card__bar--positive::after { background: linear-gradient(90deg, var(--brand-feedback-alert), var(--brand-complementary-02)); }
.ds-card__meter { display: flex; align-items: center; gap: var(--ds-gap-small-l); color: var(--icon-active); }
.ds-card__meter > .ds-card__bar { flex: 1; width: auto; }
.ds-card__table { width: 100%; border: var(--border-1) solid var(--border-default); border-radius: var(--radius-400); border-collapse: separate; border-spacing: 0; overflow: hidden; }

.ds-card__table th:first-child, .ds-card__table td:first-child { text-align: left; font-weight: 600; }
.ds-card__table thead th { font-weight: 400; color: var(--text-secondary); }
.ds-card__table tfoot td { border-top: var(--border-1) solid var(--border-default); font-weight: 600; }
.ds-card__footer { display: flex; align-items: center; gap: var(--ds-gap-small-l); margin-top: auto; padding-top: var(--ds-gap-small-s); }
.ds-card__footer > .ds-btn { flex: 1 1 0; min-width: 0; }

/* ProgressBar: barra de avanço com evolução de cor por faixa */
@property --ds-progress-from { syntax: "<color>"; inherits: true; initial-value: #f4715d; }
@property --ds-progress-to { syntax: "<color>"; inherits: true; initial-value: #ffa952; }
.ds-progress {
  --v: 0;
  --ds-progress-h: var(--size-progress-height, 8px);
  --ds-progress-dur: 0.6s;
  --ds-progress-from: var(--brand-feedback-negative-mid);
  --ds-progress-to: var(--brand-secondary-light);
  display: flex; flex-direction: column; gap: var(--ds-gap-small-l); width: 100%; color: var(--text-active);
  transition: --ds-progress-from var(--ds-progress-dur) ease, --ds-progress-to var(--ds-progress-dur) ease;
}
.ds-progress[data-level="low"] { --ds-progress-from: var(--brand-feedback-negative-mid); --ds-progress-to: var(--brand-secondary-light); }
.ds-progress[data-level="medium"] { --ds-progress-from: var(--brand-secondary-light); --ds-progress-to: var(--brand-complementary-04); }
.ds-progress[data-level="high"] { --ds-progress-from: var(--brand-complementary-04); --ds-progress-to: var(--brand-complementary-02); }
.ds-progress[data-level="full"] { --ds-progress-from: var(--brand-complementary-02); --ds-progress-to: var(--brand-primary-pure); }
.ds-progress__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ds-gap-small-xl); }
.ds-progress__value { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.ds-progress__row { display: flex; align-items: center; gap: var(--ds-gap-small-xl); }
.ds-progress__track { position: relative; flex: 1; min-width: 0; height: var(--ds-progress-h); border-radius: var(--radius-900); background: var(--surface-disabled); overflow: hidden; }
.ds-progress__fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 1%); min-width: var(--ds-progress-h); border-radius: var(--radius-900); background: linear-gradient(90deg, var(--ds-progress-from), var(--ds-progress-to)); transition: width var(--ds-progress-dur) cubic-bezier(0.4, 0, 0.2, 1); }
.ds-progress[data-level="empty"] .ds-progress__fill { background: var(--brand-neutral-mid-light); }
.ds-progress--waiting .ds-progress__fill { animation: ds-progress-wait 1.4s ease-in-out infinite; }
.ds-progress__action { display: inline-flex; flex: none; align-items: center; justify-content: center; width: var(--size-icon-m, 20px); height: var(--size-icon-m, 20px); padding: 0; border: 0; border-radius: var(--radius-100); background: none; color: var(--icon-active); }
button.ds-progress__action { cursor: pointer; transition: background-color var(--ds-transition); }
button.ds-progress__action:hover { background: var(--brand-background-opaque-04); }
@keyframes ds-progress-wait { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) {
  .ds-progress { transition: none; }
  .ds-progress__fill { transition: none; }
  .ds-progress--waiting .ds-progress__fill { animation: none; }
}

/* Sem estado de foco: nenhum anel nem realce de foco nos componentes */
[class*="ds-"]:focus, [class*="ds-"]:focus-visible { outline: 0; }

/* Complementos da camada React (não fazem parte do bundle.css): Select e PageGrid. */
.ds-select { position: relative; }
.ds-select__panel { position: absolute; top: calc(100% + var(--ds-gap-small-s, 4px)); left: 0; right: 0; z-index: var(--z-dropdown, 20); }

.ds-select .ds-field__box, .ds-select .ds-field__input { cursor: pointer; text-overflow: ellipsis; }
.ds-select .ds-field__icon { transition: transform .15s; }
.ds-select.is-open .ds-field__icon { transform: rotate(180deg); }
.ds-search > .ds-menu { position: absolute; top: calc(100% + var(--ds-gap-small-s, 4px)); left: 0; z-index: var(--z-dropdown, 20); }

/* Grade da página (valores do guia do Grid: gutter, margens e colunas por breakpoint) */
.ds-page-grid {
  --ds-pg-gut: var(--size-grid-gutter-mobile, 12px); --ds-pg-mx: var(--size-page-margin-mobile, 16px);
  --ds-pg-my: var(--size-page-margin-block-mobile, 12px); --ds-pg-cols: 4;
  display: grid; grid-template-columns: repeat(var(--ds-pg-cols), minmax(0, 1fr)); gap: var(--ds-pg-gut);
  max-width: var(--size-container-max, 1440px); margin: 0 auto; padding: var(--ds-pg-my) var(--ds-pg-mx); box-sizing: border-box;
}
.ds-page-grid__col { grid-column: 1 / -1; min-width: 0; }
@media (min-width: 600px) {
  .ds-page-grid { --ds-pg-gut: var(--size-grid-gutter-tablet, 16px); --ds-pg-mx: var(--size-page-margin-tablet, 24px); --ds-pg-my: var(--size-page-margin-block-tablet, 16px); --ds-pg-cols: 8; }
  .ds-page-grid__col { grid-column: span var(--span-t, 8); }
}
@media (min-width: 1024px) {
  .ds-page-grid { --ds-pg-gut: var(--size-grid-gutter-desktop, 24px); --ds-pg-mx: var(--size-page-margin-desktop, 32px); --ds-pg-my: var(--size-page-margin-block-desktop, 24px); --ds-pg-cols: 12; }
  .ds-page-grid--dense { --ds-pg-gut: var(--size-grid-gutter-desktop-dense, 8px); --ds-pg-mx: var(--size-page-margin-desktop-dense, 8px); --ds-pg-my: var(--size-page-margin-block-desktop-dense, 8px); }
  .ds-page-grid__col { grid-column: span var(--span, 12); }
}

// Na aplica\xE7\xE3o
import '@mrvco/design-system-react/styles.css';   // tokens + componentes
import { Button, TextField, Select, ToastProvider, useToast } from '@mrvco/design-system-react';

// <html data-theme="light"> ou "dark", com as fontes Outfit e Material Symbols Rounded carregadas`,buttons:`import { Button, IconButton } from '@mrvco/design-system-react';

<Button icon="check">Aplicar</Button>
<Button appearance="light" icon="chevron_right">Avan\xE7ar</Button>
<Button pill>P\xEDlula</Button>

<Button variant="positive" icon="check">Confirmar</Button>
<Button variant="negative" appearance="outline" icon="close">Sair</Button>
<Button variant="alert" icon="block">Inativar</Button>
<Button disabled>Desabilitado</Button>

<IconButton icon="tune" aria-label="Filtros" appearance="light" />
<IconButton icon="check" aria-label="Aplicar" pill />
<IconButton icon="close" aria-label="Fechar" variant="negative" appearance="light" />`,choices:`import { Checkbox, Radio, RadioGroup, Toggle, ThreeWaySwitch } from '@mrvco/design-system-react';

<Checkbox label="Marcada" defaultChecked />
<Checkbox label="Parcial" indeterminate />
<Checkbox label="Desabilitada" disabled />

<RadioGroup
  name="exemplo"
  aria-label="Exemplo"
  defaultValue="b"
  options={[
    { value: 'a', label: 'N\xE3o selecionado' },
    { value: 'b', label: 'Selecionado' },
  ]}
/>

<Toggle label="Ligado" defaultChecked />
<Toggle label="Alerta" alert />
<Toggle label="Desabilitado" disabled />

const [valor, setValor] = useState<'a' | 'n' | 'b'>('n');
<ThreeWaySwitch label="Descri\xE7\xE3o da tarefa" hint="(obrigat\xF3rio)" value={valor} onChange={setValor} />`,chips:`import { Chip, Callout, Tooltip, TooltipList, TooltipInfo, TooltipDetail } from '@mrvco/design-system-react';

<Chip>Nome item</Chip>
<Chip outline onRemove={() => {}}>Remover</Chip>
<Chip menuItems={[{ label: 'Op\xE7\xE3o 1' }, { label: 'Op\xE7\xE3o 2' }]}>Menu</Chip>

<Callout tone="alert">As altera\xE7\xF5es s\xE3o aplicadas automaticamente.</Callout>
<Callout tone="accent" title="Modo Replanejamento ativo!">
  Os servi\xE7os posteriores ter\xE3o prazos recalculados.
</Callout>

<Tooltip>informa\xE7\xE3o de texto a ser exibida</Tooltip>
<TooltipList items={emails} onRemove={(i) => setEmails(emails.filter((_, j) => j !== i))} />
<TooltipInfo sections={[{ title: 'Normal', items: [{ code: '086420' }] }]} />
<TooltipDetail title="Lan\xE7amento" meta={[{ label: 'SKU', value: 'TCLASS03--2QSV-DW', copyable: true }]} />`,fields:`import { TextField, SearchField, Select } from '@mrvco/design-system-react';

<TextField label="Padr\xE3o" leftIcon="edit" defaultValue="Campo de texto" counter={64} rightIcon="expand_more" helper="Input Helper" />
<TextField label="Erro" state="error" leftIcon="search" helper="Input Helper" />
<TextField label="Alerta" state="alert" helper="Input Helper" />
<TextField label="Desabilitado" state="disabled" defaultValue="Campo de texto" />
<TextField label="Oculto" state="hidden" leftIcon="dialpad" defaultValue="123456789" />
<TextField label="Limpar texto" clearable="text" leftIcon="edit" defaultValue="Campo de texto" />
<TextField label="M\xFAltiplos itens" chips={chips} onChipRemove={(i) => setChips(chips.filter((_, j) => j !== i))} onAdd={() => setChips([...chips, 'Novo'])} />
<TextField label="Contador" value="01" onChange={() => {}} stepper={{ onIncrement, onDecrement }} />

<SearchField value={q} onChange={setQ} onSearch={buscar} select={{ options: ['Todas', 'Projetos', 'Pessoas'] }} />

<Select label="Comit\xEA respons\xE1vel" placeholder="Selecione um comit\xEA"
  options={[{ value: 'exco', label: 'ExCo' }, { value: 'opco', label: 'OpCo' }]} />
<Select label="Dias da semana" multiple placeholder="Selecione um ou mais dias"
  options={dias.map((d) => ({ value: d, label: d }))} />`,menus:`import {
  Menu, Toast, ToastBlock, ToastProvider, useToast, Modal, ModalWindow, Drawer, DrawerSection, Button, TextField, Toggle,
} from '@mrvco/design-system-react';

<Menu variant="complex" title="T\xEDtulo" items={[{ value: '1', label: 'Item 1', icon: 'search' }]} />
<Menu variant="simple" items={[{ value: '1', label: 'Item 1' }]} onSelect={(v) => {}} />
<Menu variant="multiple" value={['2']} items={itens} onApply={(valores) => {}} />

<Toast kind="info" title="Informa\xE7\xE3o" text="Existem novas notifica\xE7\xF5es" />
<ToastBlock kind="success" onClose={() => {}}>Mensagem ou descri\xE7\xE3o</ToastBlock>
